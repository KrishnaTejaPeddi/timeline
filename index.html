<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12,000 Years — A Scrolling Timeline</title>
<style>
  :root{
    --bg: #f2ede3;
    --ink: #262019;
    --line: #262019;
    --rule: #b9ad98;
    --accent: #a8442f;
    --band-a: #e7ddc8;
    --band-b: #ddd0b3;
    --popup-bg: #fffdf7;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    height:100%;
  }
  header{
    padding: 24px 32px 12px;
    border-bottom: 1px solid var(--rule);
  }
  h1{
    margin:0 0 4px;
    font-size: 1.6rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  p.sub{
    margin:0;
    font-size: 0.95rem;
    color: #5b5344;
    max-width: 60ch;
  }
  .hint{
    font-size: 0.85rem;
    color: #5b5344;
    margin-top: 8px;
  }
  .hint kbd{
    font-family: Georgia, serif;
    border: 1px solid var(--rule);
    border-bottom-width: 2px;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 0.8rem;
  }

  #scroller{
    overflow-x: scroll;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    width: 100%;
    height: calc(100vh - 100px);
    position: relative;
  }

  #track{
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .eras{
    position: relative;
    height: 42px;
    flex: 0 0 auto;
    display: flex;
  }
  .era{
    height: 100%;
    display:flex;
    align-items:center;
    padding-left: 10px;
    font-size: 0.78rem;
    letter-spacing: 0.02em;
    color: #4a4030;
    white-space: nowrap;
    border-right: 1px solid var(--rule);
  }
  .era span{
    position: sticky;
    left: 10px;
  }

  .spine-wrap{
    position: relative;
    flex: 1 1 auto;
  }

  .spine{
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--line);
    pointer-events: none;
  }

  /* the clickable hit-area for one 50-year increment */
  .increment{
    position: absolute;
    top: 0;
    bottom: 0;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: transparent;
    border: none;
    padding: 0;
  }
  .increment:hover .tick{
    background: var(--accent);
  }
  .increment:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  .increment.active .tick{
    background: var(--accent);
    width: 2px;
  }

  .tick{
    position: absolute;
    top: 50%;
    width: 1px;
    background: var(--rule);
    pointer-events: none;
  }
  .tick.minor{ height: 12px; margin-top: -6px; }
  .tick.mid{ height: 20px; margin-top: -10px; background: #8f846d; }
  .tick.major{ height: 34px; margin-top: -17px; background: var(--ink); width: 1.5px; }

  .info-dot{
    position: absolute;
    top: 50%;
    margin-top: 20px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    pointer-events: none;
  }

  .label{
    position: absolute;
    top: 50%;
    margin-top: 26px;
    transform: translateX(-50%);
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
    pointer-events: none;
  }

  .start-flag, .now-flag-label{
    position: absolute;
    top: 50%;
    margin-top: -58px;
    transform: translateX(-50%);
    font-size: 0.78rem;
    font-weight: 700;
    white-space: nowrap;
    pointer-events: none;
  }

  .popup{
    position: absolute;
    top: 50%;
    margin-top: -22px;
    transform: translate(-50%, -100%);
    background: var(--popup-bg);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 10px 12px;
    min-width: 160px;
    max-width: 240px;
    box-shadow: 3px 3px 0 rgba(38,32,25,0.15);
    z-index: 20;
    font-size: 0.82rem;
    line-height: 1.35;
  }
  .popup .popup-year{
    font-weight: 700;
    margin-bottom: 4px;
    display: block;
  }
  .popup .popup-empty{
    color: #7a7160;
    font-style: italic;
  }
  .popup::after{
    content: "";
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-top: 8px solid var(--ink);
  }
  .popup::before{
    content: "";
    position: absolute;
    bottom: -5.5px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 7px solid var(--popup-bg);
    z-index: 1;
  }
</style>
</head>
<body>

<header>
  <h1>Twelve Thousand Years</h1>
  <p class="sub">A single line from 10,000 BCE to today. Every mark is 50 years — click one to see what happened.</p>
  <p class="hint">Scroll right to move forward in time (<kbd>shift</kbd> + scroll, trackpad swipe, or drag the scrollbar) — click any mark for details, click it again to close.</p>
</header>

<div id="scroller">
  <div id="track">
    <div class="eras" id="eras"></div>
    <div class="spine-wrap" id="spineWrap">
      <div class="spine"></div>
    </div>
  </div>
</div>

  const START_YEAR = -10000;   // 10000 BCE
  const CURRENT_YEAR = 2026;

  const PX_PER_STEP = 90;      // spread out: pixels between increments
  const MAJOR_EVERY = 10;      // every 10th increment (500 yrs) gets a permanent label
  const MID_EVERY = 2;         // every 2nd increment (100 yrs) gets a mid-size tick

  const eras = [

    { year: -9000,  text: "Jericho — one of the earliest known continuously inhabited settlements." },

    { year: -4000,  text: "Uruk period begins — southern Mesopotamia develops some of the world's first true cities." },

    // --- added batch: 1500 CE – 2026, plus deep-history "obscure" picks ---
    { year: 1492,  text: "Columbus reaches the Americas." },

    { year: 1517,  text: "Protestant Reformation begins." },

    { year: 1665,  text: "Hooke coins the word \"cell\" after viewing cork under a microscope." },
    { year: 1687,  text: "Newton publishes the Principia Mathematica." },
    { year: 1688,  text: "Glorious Revolution." },

    { year: 1799,  text: "Napoleon takes power." },

    { year: 1837,  text: "Telegraph developed." },
    { year: 1848,  text: "Revolutions across Europe." },
    { year: 1859,  text: "Darwin publishes On the Origin of Species." },

    // --- deep-history detail picks ---
    { year: -3400, text: "First known personal names written down." },
    { year: -3300, text: "Earliest known wheeled vehicles." },
    { year: -3200, text: "Earliest known writing." },
    { year: -2600, text: "First known flush-like drainage systems in Indus cities." },
    { year: -2000, text: "Minoan civilization develops complex maritime networks." },
    { year: -1600, text: "Mycenaean Linear B records the Greek language." },
    { year: -1200, text: "Bronze Age Collapse." },
    { year: -600,  text: "Lydia develops early coinage." },
    { year: -300,  text: "Antikythera-mechanism-level Greek mechanical astronomy eventually emerges." },
    { year: -100,  text: "Paper-like materials and advanced Chinese bureaucracy develop." },
    { year: 105,   text: "Cai Lun traditionally credited with improving papermaking." },
    { year: 200,   text: "Roman concrete technology reaches extraordinary scale." },
    { year: 500,   text: "Zero begins developing as a mathematical concept in South Asia." },
    { year: 600,   text: "Hindu-Arabic numeral system develops (c. 600–700)." },
    { year: 800,   text: "Baghdad becomes a major intellectual center." },
    { year: 850,   text: "Al-Khwarizmi's mathematical work gives us the word \"algorithm\"." },
    { year: 1000,  text: "Chinese movable-type / printing innovations." },
    { year: 1040,  text: "Bi Sheng develops movable type." },
    { year: 1200,  text: "Magnetic compass becomes important for navigation." },
    { year: 1300,  text: "Mechanical clocks begin emerging in Europe." },
    { year: 1450,  text: "Printing fundamentally changes information transmission." },
  ];

  const totalSteps = Math.round((CURRENT_YEAR - START_YEAR) / STEP);
  const totalWidth = totalSteps * PX_PER_STEP + 200;

  function yearToLabel(y){
    if (y === 0) return "0";
    return Math.abs(y) + (y < 0 ? " BCE" : " CE");
  }
  function stepToYear(i){
    return START_YEAR + i * STEP;
  }
  function stepToX(i){
    return i * PX_PER_STEP;
  }

  // group events onto their nearest increment index
  const eventsByStep = {};
  events.forEach(ev => {
    const idx = Math.round((ev.year - START_YEAR) / STEP);
    if (!eventsByStep[idx]) eventsByStep[idx] = [];
    eventsByStep[idx].push(ev);
  });

  // ---- layout ----
  const track = document.getElementById('track');
  const spineWrap = document.getElementById('spineWrap');
  const erasRow = document.getElementById('eras');
  track.style.width = totalWidth + "px";

  // era bands
  eras.forEach((e, i) => {
    const div = document.createElement('div');
    div.className = 'era';
    const x0 = stepToX(Math.round((e.start - START_YEAR) / STEP));
    const x1 = stepToX(Math.round((Math.min(e.end, CURRENT_YEAR) - START_YEAR) / STEP));
    div.style.width = (x1 - x0) + "px";
    div.style.background = i % 2 === 0 ? 'var(--band-a)' : 'var(--band-b)';
    const span = document.createElement('span');
    span.textContent = e.name;
    div.appendChild(span);
    erasRow.appendChild(div);
  });

  const frag = document.createDocumentFragment();

  for (let i = 0; i <= totalSteps; i++){
    const year = stepToYear(i);
    const x = stepToX(i);

    const btn = document.createElement('button');
    btn.className = 'increment';
    btn.style.left = x + "px";
    btn.style.width = PX_PER_STEP + "px";
    btn.dataset.index = i;
    btn.setAttribute('aria-label', yearToLabel(year));

    let kind = 'minor';
    if (i % MAJOR_EVERY === 0) kind = 'major';
    else if (i % MID_EVERY === 0) kind = 'mid';

    const tick = document.createElement('div');
    tick.className = 'tick ' + kind;
    btn.appendChild(tick);

    if (kind === 'major'){
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = yearToLabel(year);
      btn.appendChild(label);
    }

    if (eventsByStep[i]){
      const dot = document.createElement('div');
      dot.className = 'info-dot';
      btn.appendChild(dot);
    }

    frag.appendChild(btn);
  }
  spineWrap.appendChild(frag);

  // start flag (permanent label at 10,000 BCE)
  const startFlag = document.createElement('div');
  startFlag.className = 'start-flag';
  startFlag.style.left = "0px";
  startFlag.textContent = "10,000 BCE";
  spineWrap.appendChild(startFlag);

  // "today" as its own increment, appended at the true current-year position
  const todayX = ((CURRENT_YEAR - START_YEAR) / STEP) * PX_PER_STEP;
  const todayBtn = document.createElement('button');
  todayBtn.className = 'increment';
  todayBtn.style.left = todayX + "px";
  todayBtn.style.width = PX_PER_STEP + "px";
  todayBtn.dataset.index = "today";
  todayBtn.setAttribute('aria-label', 'Today');
  todayBtn.innerHTML = '<div class="tick major"></div><div class="info-dot"></div>';
  const todayLabel = document.createElement('div');
  todayLabel.className = 'now-flag-label';
  todayLabel.style.left = todayX + "px";
  todayLabel.style.transform = "translateX(-50%)";
  todayLabel.textContent = "Today — " + CURRENT_YEAR;
  spineWrap.appendChild(todayBtn);
  spineWrap.appendChild(todayLabel);

  // ---- click-to-toggle popups ----
  let openPopup = null;
  let openKey = null;

  function closePopup(){
    if (openPopup) openPopup.remove();
    openPopup = null;
    if (openKey !== null){
      const prev = spineWrap.querySelector('.increment.active');
      if (prev) prev.classList.remove('active');
    }
    openKey = null;
  }

  function openPopupFor(btn, key, x, year, infoList, isToday){
    const popup = document.createElement('div');
    popup.className = 'popup';
    popup.style.left = x + "px";

    const yearSpan = document.createElement('span');
    yearSpan.className = 'popup-year';
    yearSpan.textContent = isToday ? ("Today — " + CURRENT_YEAR) : yearToLabel(year);
    popup.appendChild(yearSpan);

    if (infoList && infoList.length){
      infoList.forEach(ev => {
        const p = document.createElement('div');
        p.textContent = ev.text;
        popup.appendChild(p);
      });
    } else {
      const p = document.createElement('div');
      p.className = 'popup-empty';
      p.textContent = 'No information for this period.';
      popup.appendChild(p);
    }

    spineWrap.appendChild(popup);
    openPopup = popup;
    openKey = key;
    btn.classList.add('active');
  }

  spineWrap.addEventListener('click', (e) => {
    const btn = e.target.closest('.increment');
    if (!btn) return;

    const key = btn.dataset.index;

    if (openKey === key){
      closePopup();
      return;
    }

    closePopup();

    const x = parseFloat(btn.style.left);
    if (key === "today"){
      openPopupFor(btn, key, x, CURRENT_YEAR, [{ text: "You are here." }], true);
    } else {
      const idx = parseInt(key, 10);
      const year = stepToYear(idx);
      openPopupFor(btn, key, x, year, eventsByStep[idx], false);
    }
  });

  // close popup when clicking elsewhere (but not on an increment or the popup itself)
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.increment') && !e.target.closest('.popup')){
      closePopup();
    }
  });

  // allow vertical wheel scroll to move the horizontal track
  const scroller = document.getElementById('scroller');
  scroller.addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      scroller.scrollLeft += e.deltaY;
      e.preventDefault();
    }
  }, { passive: false });
</script>

</body>
</html>
