<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12,000 Years — A Scrolling Timeline</title>
<style>
  :root{
    --bg: #f2ede3;
    --ink: #262019;
    --line: #262019;
    --rule: #b9ad98;
    --accent: #a8442f;
    --band-a: #e7ddc8;
    --band-b: #ddd0b3;
    --popup-bg: #fffdf7;

    --cat-war: #a8442f;
    --cat-science: #2c6e8e;
    --cat-politics: #6a4c93;
    --cat-disaster: #b5651d;
    --cat-culture: #3f7d43;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    height:100%;
  }
  header{
    padding: 20px 32px 12px;
    border-bottom: 1px solid var(--rule);
  }
  h1{
    margin:0 0 4px;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  p.sub{
    margin:0;
    font-size: 0.92rem;
    color: #5b5344;
    max-width: 60ch;
  }
  .hint{
    font-size: 0.82rem;
    color: #5b5344;
    margin: 6px 0 12px;
  }
  .hint kbd{
    font-family: Georgia, serif;
    border: 1px solid var(--rule);
    border-bottom-width: 2px;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 0.78rem;
  }

  /* ---- controls bar ---- */
  .controls{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px 22px;
    font-family: Georgia, serif;
    font-size: 0.82rem;
  }
  .controls .group{
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .controls input[type="text"]{
    font-family: Georgia, serif;
    font-size: 0.82rem;
    padding: 5px 8px;
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: #fffdf7;
    color: var(--ink);
    width: 180px;
  }
  .controls button{
    font-family: Georgia, serif;
    font-size: 0.8rem;
    padding: 5px 10px;
    border: 1px solid var(--ink);
    border-radius: 4px;
    background: #fffdf7;
    color: var(--ink);
    cursor: pointer;
  }
  .controls button:hover{ background: var(--band-a); }
  .controls button.primary{
    background: var(--ink);
    color: var(--bg);
  }
  .controls button.primary:hover{ opacity: 0.85; }
  #searchMsg{
    font-size: 0.76rem;
    color: var(--accent);
    font-style: italic;
  }
  .controls input[type="range"]{ width: 110px; }
  .legend{
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .legend label{
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    white-space: nowrap;
  }
  .swatch{
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }
  .swatch.war{ background: var(--cat-war); }
  .swatch.science{ background: var(--cat-science); }
  .swatch.politics{ background: var(--cat-politics); }
  .swatch.disaster{ background: var(--cat-disaster); }
  .swatch.culture{ background: var(--cat-culture); }

  #scroller{
    overflow-x: scroll;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    width: 100%;
    height: calc(100vh - 168px);
    position: relative;
  }

  #track{
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .eras{
    position: relative;
    height: 42px;
    flex: 0 0 auto;
    display: flex;
  }
  .era{
    height: 100%;
    display:flex;
    align-items:center;
    padding-left: 10px;
    font-size: 0.78rem;
    letter-spacing: 0.02em;
    color: #4a4030;
    white-space: nowrap;
    border-right: 1px solid var(--rule);
  }
  .era span{
    position: sticky;
    left: 10px;
  }

  .spine-wrap{
    position: relative;
    flex: 1 1 auto;
  }

  .spine{
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--line);
    pointer-events: none;
  }

  /* the clickable hit-area for one 50-year increment */
  .increment{
    position: absolute;
    top: 0;
    bottom: 0;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: transparent;
    border: none;
    padding: 0;
  }
  .increment:hover .tick{
    background: var(--accent);
  }
  .increment:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  .increment.active .tick{
    background: var(--accent);
    width: 2px;
  }

  /* focus mode: hide increments with no currently-visible info, keep major ticks for orientation */
  body.focus-mode .increment:not(.has-info):not(.is-major){
    visibility: hidden;
    pointer-events: none;
  }

  .tick{
    position: absolute;
    top: 50%;
    width: 1px;
    background: var(--rule);
    pointer-events: none;
  }
  .tick.minor{ height: 12px; margin-top: -6px; }
  .tick.mid{ height: 20px; margin-top: -10px; background: #8f846d; }
  .tick.major{ height: 34px; margin-top: -17px; background: var(--ink); width: 1.5px; }

  .info-dot{
    position: absolute;
    top: 50%;
    margin-top: 20px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    pointer-events: none;
  }

  .label{
    position: absolute;
    top: 50%;
    margin-top: 26px;
    transform: translateX(-50%);
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
    pointer-events: none;
  }

  .start-flag, .now-flag-label{
    position: absolute;
    top: 50%;
    margin-top: -58px;
    transform: translateX(-50%);
    font-size: 0.78rem;
    font-weight: 700;
    white-space: nowrap;
    pointer-events: none;
  }

  .popup{
    position: absolute;
    top: 50%;
    margin-top: -22px;
    transform: translate(-50%, -100%);
    background: var(--popup-bg);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 10px 12px;
    min-width: 180px;
    max-width: 260px;
    box-shadow: 3px 3px 0 rgba(38,32,25,0.15);
    z-index: 20;
    font-size: 0.82rem;
    line-height: 1.35;
  }
  .popup .popup-year{
    font-weight: 700;
    margin-bottom: 4px;
    display: block;
  }
  .popup .popup-empty{
    color: #7a7160;
    font-style: italic;
  }
  .popup .popup-event{
    display: flex;
    gap: 6px;
    margin-bottom: 4px;
    align-items: flex-start;
  }
  .popup .popup-event .swatch{
    margin-top: 5px;
    flex: 0 0 auto;
  }
  .popup::after{
    content: "";
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-top: 8px solid var(--ink);
  }
  .popup::before{
    content: "";
    position: absolute;
    bottom: -5.5px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 7px solid var(--popup-bg);
    z-index: 1;
  }

  /* ---- minimap ---- */
  #minimap{
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 16px;
    background: var(--band-b);
    border-top: 1px solid var(--rule);
    cursor: pointer;
    z-index: 30;
  }
  #minimapFill{
    position: absolute;
    top: 0;
    bottom: 0;
    background: var(--accent);
    opacity: 0.55;
    pointer-events: none;
  }
</style>
</head>

<header>
  <h1>Twelve Thousand Years</h1>
  <p class="sub">A single line from 10,000 BCE to today. Every mark is 50 years — click one to see what happened.</p>
  <p class="hint">Scroll right to move forward (<kbd>shift</kbd>+scroll, trackpad, or drag) · click a mark for details, click again to close · <kbd>←</kbd>/<kbd>→</kbd> hop between dated points.</p>

  <div class="controls">
    <div class="group">
      <input type="text" id="searchInput" placeholder="Jump to a year or keyword…">
      <button class="primary" id="searchBtn">Go</button>
      <span id="searchMsg"></span>
    </div>
    <div class="group">
      <label for="zoomSlider">Zoom</label>
      <input type="range" id="zoomSlider" min="30" max="180" step="5" value="90">
    </div>
    <div class="group">
      <button id="playBtn">▶ Play</button>
    </div>
    <div class="group">
      <label><input type="checkbox" id="focusToggle"> Only dated points</label>
    </div>
    <div class="legend" id="legend">
      <label><input type="checkbox" class="cat-toggle" data-cat="war" checked> <span class="swatch war"></span>War</label>
      <label><input type="checkbox" class="cat-toggle" data-cat="science" checked> <span class="swatch science"></span>Science</label>
      <label><input type="checkbox" class="cat-toggle" data-cat="politics" checked> <span class="swatch politics"></span>Politics</label>
      <label><input type="checkbox" class="cat-toggle" data-cat="disaster" checked> <span class="swatch disaster"></span>Disaster</label>
      <label><input type="checkbox" class="cat-toggle" data-cat="culture" checked> <span class="swatch culture"></span>Culture</label>
    </div>
  </div>
</header>

<div id="scroller">
  <div id="track">
    <div class="eras" id="eras"></div>
    <div class="spine-wrap" id="spineWrap">
      <div class="spine"></div>
    </div>
  </div>
</div>

<div id="minimap"><div id="minimapFill"></div></div>

    { year: 100,   text: "Kingdom of Aksum rises as a major trade power in East Africa." },
    { year: 320,   text: "Gupta Empire golden age in South Asia — mathematics, astronomy and the arts flourish." },
    { year: 476,   text: "Fall of the Western Roman Empire." },
    { year: 529,   text: "Justinian Code compiled — a comprehensive codification of Roman law." },
    { year: 541,   text: "Justinian's Plague — one of the earliest well-documented pandemics." },
    { year: 632,   text: "Death of Muhammad and the rapid early Islamic conquests that follow." },
    { year: 700,   text: "Tang dynasty golden age in China." },
    { year: 793,   text: "Viking Age begins with the raid on Lindisfarne." },
    { year: 800,   text: "Charlemagne crowned Holy Roman Emperor." },
    { year: 1000,  text: "Song dynasty innovations in China — printing, gunpowder weapons, paper money." },
    { year: 1050,  text: "Cahokia flourishes as a major urban center in North America." },
    { year: 1066,  text: "Battle of Hastings — Norman conquest of England." },
    { year: 1096,  text: "The Crusades begin." },
    { year: 1100,  text: "Great Zimbabwe rises as a major trading center in southern Africa." },
    { year: 1206,  text: "Genghis Khan founds the Mongol Empire." },
    { year: 1215,  text: "Magna Carta signed in England." },
    { year: 1250,  text: "Maya civilization's later city-states flourish." },
    { year: 1324,  text: "Mansa Musa's pilgrimage showcases the wealth of the Mali Empire." },
    { year: 1325,  text: "Tenochtitlan founded, capital of the Aztec Empire." },
    { year: 1368,  text: "Ming dynasty founded in China." },
    { year: 1405,  text: "Zheng He's treasure-fleet voyages begin." },
    { year: 1438,  text: "Inca Empire founded in the Andes." },
    { year: 1440,  text: "Gutenberg develops the movable-type printing press in Europe." },
    { year: 1453,  text: "Fall of Constantinople to the Ottomans." },
    { year: 1464,  text: "Songhai Empire rises to dominance in West Africa." },
    { year: 1919,  text: "Treaty of Versailles signed, ending World War I." },
    { year: 1920,  text: "Widespread women's suffrage movements win the vote in many countries." },
    { year: 1947,  text: "Indian independence and partition." },
    { year: 1949,  text: "Chinese Communist Revolution establishes the People's Republic of China." },
    { year: 1962,  text: "Cuban Missile Crisis brings the Cold War to the brink." },
    { year: 1963,  text: "Civil rights movement's March on Washington." },
    { year: 1989,  text: "Fall of the Berlin Wall." },
  ];

  // ---- naive keyword-based categorizer (for coloring/filtering only) ----
  function categorize(text){
    const t = text.toLowerCase();
    if (/scientific revolution|computing revolution|industrial age/.test(t)) return 'science';
    if (/pandemic|plague|flu\b|famine|earthquake|\bcollapse\b|disaster/.test(t)) return 'disaster';
    if (/\bwar\b|battle|conquest|invasion|invaders|revolt|revolution|rebellion|siege|crusade|fall of|civil war|military|raid\b/.test(t)) return 'war';
    if (/discover|invent|publish|theory|telescope|physics|mathematic|algorithm|microscope|\bgene\b|\bdna\b|spaceflight|microprocessor|internet|\bweb\b|transistor|vaccine|penicillin|relativity|electron|radioactiv|periodic table|higgs|gravitational|hubble|crispr|cloned|numeral|\bzero\b|writing emerges|papermaking|printing|compass|clock|steam engine|battery|induction|x-rays|astronomy|movable type/.test(t)) return 'science';
    if (/empire|kingdom|dynasty|republic|democracy|constitution|declaration|independence|founded|government|president|\bking\b|emperor|treaty|legal code|code of|union|\bnation\b|parliament|suffrage|\brights\b|crowned|partition/.test(t)) return 'politics';
    return 'culture';
  }
  const CAT_COLOR = {
    war: 'var(--cat-war)',
    science: 'var(--cat-science)',
    politics: 'var(--cat-politics)',
    disaster: 'var(--cat-disaster)',
    culture: 'var(--cat-culture)',
  };
  events.forEach(ev => { ev.category = categorize(ev.text); });

  const totalSteps = Math.round((CURRENT_YEAR - START_YEAR) / STEP);

  function yearToLabel(y){
    if (y === 0) return "0";
    return Math.abs(y) + (y < 0 ? " BCE" : " CE");
  }
  function stepToYear(i){
    return START_YEAR + i * STEP;
  }
  function stepToX(i){
    return i * PX_PER_STEP;
  }
  function yearToStepIdx(y){
    return Math.round((y - START_YEAR) / STEP);
  }

  // group events onto their nearest increment index
  const eventsByStep = {};
  events.forEach(ev => {
    const idx = yearToStepIdx(ev.year);
    if (!eventsByStep[idx]) eventsByStep[idx] = [];
    eventsByStep[idx].push(ev);
  });
  const sortedEventStepIndices = Object.keys(eventsByStep).map(Number).sort((a,b) => a-b);

  // ---- active category filters ----
  const activeCategories = new Set(['war','science','politics','disaster','culture']);
  function getVisibleEvents(idx){
    const list = eventsByStep[idx];
    if (!list) return [];
    return list.filter(ev => activeCategories.has(ev.category));
  }

  // ---- layout ----
  const track = document.getElementById('track');
  const spineWrap = document.getElementById('spineWrap');
  const erasRow = document.getElementById('eras');

  // era bands
  const eraDivs = [];
  eras.forEach((e, i) => {
    const div = document.createElement('div');
    div.className = 'era';
    const startIdx = yearToStepIdx(e.start);
    const endIdx = yearToStepIdx(Math.min(e.end, CURRENT_YEAR));
    div.style.background = i % 2 === 0 ? 'var(--band-a)' : 'var(--band-b)';
    const span = document.createElement('span');
    span.textContent = e.name;
    div.appendChild(span);
    erasRow.appendChild(div);
    eraDivs.push({ div, startIdx, endIdx });
  });

  const incrementEls = [];
  const dotsByIndex = {};

  const frag = document.createDocumentFragment();
  for (let i = 0; i <= totalSteps; i++){
    const year = stepToYear(i);
    if (year > CURRENT_YEAR) break; // avoid a regular tick overlapping the "today" marker

    const btn = document.createElement('button');
    btn.className = 'increment';
    btn.dataset.index = i;
    btn.setAttribute('aria-label', yearToLabel(year));

    let kind = 'minor';
    if (i % MAJOR_EVERY === 0) kind = 'major';
    else if (i % MID_EVERY === 0) kind = 'mid';
    if (kind === 'major') btn.classList.add('is-major');

    const tick = document.createElement('div');
    tick.className = 'tick ' + kind;
    btn.appendChild(tick);

    if (kind === 'major'){
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = yearToLabel(year);
      btn.appendChild(label);
    }

    if (eventsByStep[i]){
      const dot = document.createElement('div');
      dot.className = 'info-dot';
      btn.appendChild(dot);
      dotsByIndex[i] = dot;
      btn.classList.add('has-info');
    }

    frag.appendChild(btn);
    incrementEls.push(btn);
  }
  spineWrap.appendChild(frag);

  // start flag (permanent label at 10,000 BCE)
  const startFlag = document.createElement('div');
  startFlag.className = 'start-flag';
  startFlag.textContent = "10,000 BCE";
  spineWrap.appendChild(startFlag);

  // "today" as its own increment, appended at the true current-year position
  const todayIdx = yearToStepIdx(CURRENT_YEAR);
  const todayBtn = document.createElement('button');
  todayBtn.className = 'increment is-major has-info';
  todayBtn.dataset.index = "today";
  todayBtn.setAttribute('aria-label', 'Today');
  todayBtn.innerHTML = '<div class="tick major"></div><div class="info-dot"></div>';
  const todayLabel = document.createElement('div');
  todayLabel.className = 'now-flag-label';
  todayLabel.textContent = "Today — " + CURRENT_YEAR;
  spineWrap.appendChild(todayBtn);
  spineWrap.appendChild(todayLabel);
  dotsByIndex['today'] = todayBtn.querySelector('.info-dot');

  // ---- relayout (used on zoom change) ----
  function relayout(){
    const totalWidth = totalSteps * PX_PER_STEP + 200;
    track.style.width = totalWidth + "px";

    incrementEls.forEach((btn, i) => {
      btn.style.left = (i * PX_PER_STEP) + "px";
      btn.style.width = PX_PER_STEP + "px";
    });
    eraDivs.forEach(o => {
      o.div.style.width = ((o.endIdx - o.startIdx) * PX_PER_STEP) + "px";
    });

    const todayX = todayIdx * PX_PER_STEP;
    todayBtn.style.left = todayX + "px";
    todayBtn.style.width = PX_PER_STEP + "px";
    todayLabel.style.left = todayX + "px";
    todayLabel.style.transform = "translateX(-50%)";
    startFlag.style.left = "0px";

    closePopup();
    updateMinimap();
  }

  // ---- category coloring / filtering ----
  function refreshCategoryVisibility(){
    sortedEventStepIndices.forEach(idx => {
      const visible = getVisibleEvents(idx);
      const dot = dotsByIndex[idx];
      const btn = incrementEls[idx];
      if (!dot || !btn) return;
      if (visible.length){
        dot.style.display = '';
        dot.style.background = CAT_COLOR[visible[0].category];
        btn.classList.add('has-info');
      } else {
        dot.style.display = 'none';
        btn.classList.remove('has-info');
      }
    });
    closePopup();
  }

  document.querySelectorAll('.cat-toggle').forEach(cb => {
    cb.addEventListener('change', () => {
      const cat = cb.dataset.cat;
      if (cb.checked) activeCategories.add(cat); else activeCategories.delete(cat);
      refreshCategoryVisibility();
    });
  });

  // ---- click-to-toggle popups ----
  let openPopup = null;
  let openKey = null;

  function closePopup(){
    if (openPopup) openPopup.remove();
    openPopup = null;
    if (openKey !== null){
      const prev = spineWrap.querySelector('.increment.active');
      if (prev) prev.classList.remove('active');
    }
    openKey = null;
  }

  function openPopupFor(btn, key, x, year, infoList, isToday){
    const popup = document.createElement('div');
    popup.className = 'popup';
    popup.style.left = x + "px";

    const yearSpan = document.createElement('span');
    yearSpan.className = 'popup-year';
    yearSpan.textContent = isToday ? ("Today — " + CURRENT_YEAR) : yearToLabel(year);
    popup.appendChild(yearSpan);

    if (infoList && infoList.length){
      infoList.forEach(ev => {
        const row = document.createElement('div');
        row.className = 'popup-event';
        if (!isToday){
          const sw = document.createElement('span');
          sw.className = 'swatch';
          sw.style.background = CAT_COLOR[ev.category] || 'var(--accent)';
          row.appendChild(sw);
        }
        const txt = document.createElement('span');
        txt.textContent = ev.text;
        row.appendChild(txt);
        popup.appendChild(row);
      });
    } else {
      const p = document.createElement('div');
      p.className = 'popup-empty';
      p.textContent = 'No information for this period.';
      popup.appendChild(p);
    }

    spineWrap.appendChild(popup);
    openPopup = popup;
    openKey = key;
    btn.classList.add('active');

    if (isToday){
      history.replaceState(null, '', '#today');
    } else {
      history.replaceState(null, '', '#year=' + year);
    }
  }

  function openForKey(key){
    const btn = key === 'today' ? todayBtn : incrementEls[parseInt(key, 10)];
    if (!btn) return;
    if (openKey === key){ closePopup(); return; }
    closePopup();
    const x = parseFloat(btn.style.left);
    if (key === 'today'){
      openPopupFor(btn, key, x, CURRENT_YEAR, [{ text: "You are here." }], true);
    } else {
      const idx = parseInt(key, 10);
      const year = stepToYear(idx);
      openPopupFor(btn, key, x, year, getVisibleEvents(idx), false);
    }
  }

  spineWrap.addEventListener('click', (e) => {
    const btn = e.target.closest('.increment');
    if (!btn) return;
    openForKey(btn.dataset.index);
  });

  // close popup when clicking elsewhere (but not on an increment, popup, or controls)
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.increment') && !e.target.closest('.popup') &&
        !e.target.closest('.controls') && !e.target.closest('#minimap')){
      closePopup();
    }
  });

  // ---- scrolling ----
  const scroller = document.getElementById('scroller');

  scroller.addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      scroller.scrollLeft += e.deltaY;
      e.preventDefault();
    }
    stopPlaying();
  }, { passive: false });
  scroller.addEventListener('pointerdown', stopPlaying);

  function scrollToStepIdx(idx, openPopupToo){
    const x = idx * PX_PER_STEP;
    scroller.scrollLeft = Math.max(0, x - scroller.clientWidth / 2);
    if (openPopupToo) openForOrphanClose(idx);
  }
  function openForOrphanClose(idx){
    closePopup();
    openForKey(idx === todayIdx ? 'today' : String(idx));
  }

  // ---- search: jump to year or keyword ----
  const searchInput = document.getElementById('searchInput');
  const searchBtn = document.getElementById('searchBtn');
  const searchMsg = document.getElementById('searchMsg');

  function parseYearQuery(q){
    const s = q.trim().toLowerCase();
    let m = s.match(/^(-?\d+)\s*(bce|bc)?$/);
    if (m){
      let y = parseInt(m[1], 10);
      if (m[2]) y = -Math.abs(y);
      return y;
    }
    m = s.match(/^(\d+)\s*(ce|ad)$/);
    if (m) return parseInt(m[1], 10);
    return null;
  }

  function runSearch(){
    const q = searchInput.value;
    if (!q.trim()){ searchMsg.textContent = ''; return; }

    const asYear = parseYearQuery(q);
    if (asYear !== null){
      const clamped = Math.max(START_YEAR, Math.min(CURRENT_YEAR, asYear));
      const idx = yearToStepIdx(clamped);
      searchMsg.textContent = '';
      scrollToStepIdx(idx, true);
      return;
    }

    const needle = q.trim().toLowerCase();
    const match = events.find(ev => activeCategories.has(ev.category) && ev.text.toLowerCase().includes(needle));
    if (match){
      searchMsg.textContent = '';
      const idx = yearToStepIdx(match.year);
      scrollToStepIdx(idx, true);
    } else {
      searchMsg.textContent = 'No matches — try a year (e.g. "1969" or "1200 BCE") or a keyword.';
    }
  }
  searchBtn.addEventListener('click', runSearch);
  searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(); });

  // ---- zoom ----
  const zoomSlider = document.getElementById('zoomSlider');
  zoomSlider.addEventListener('input', () => {
    PX_PER_STEP = parseInt(zoomSlider.value, 10);
    relayout();
  });

  // ---- focus mode (only dated points) ----
  const focusToggle = document.getElementById('focusToggle');
  focusToggle.addEventListener('change', () => {
    document.body.classList.toggle('focus-mode', focusToggle.checked);
  });

  // ---- keyboard navigation between dated points ----
  document.addEventListener('keydown', (e) => {
    if (e.target === searchInput) return;
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;

    const allIdx = sortedEventStepIndices.concat([todayIdx]).sort((a,b) => a-b);
    const approx = Math.round(scroller.scrollLeft / PX_PER_STEP);

    let target;
    if (e.key === 'ArrowRight'){
      target = allIdx.find(idx => idx > approx + 2);
      if (target === undefined) target = allIdx[allIdx.length - 1];
    } else {
      const rev = allIdx.slice().reverse();
      target = rev.find(idx => idx < approx - 2);
      if (target === undefined) target = allIdx[0];
    }
    e.preventDefault();
    scrollToStepIdx(target, true);
  });

  // ---- play / auto-scroll ----
  const playBtn = document.getElementById('playBtn');
  let playing = false;
  function stopPlaying(){
    if (!playing) return;
    playing = false;
    playBtn.textContent = '▶ Play';
  }
  function playStep(){
    if (!playing) return;
    scroller.scrollLeft += 2;
    if (scroller.scrollLeft >= scroller.scrollWidth - scroller.clientWidth - 1){
      stopPlaying();
      return;
    }
    requestAnimationFrame(playStep);
  }
  playBtn.addEventListener('click', () => {
    playing = !playing;
    playBtn.textContent = playing ? '⏸ Pause' : '▶ Play';
    if (playing) requestAnimationFrame(playStep);
  });

  // ---- minimap ----
  const minimap = document.getElementById('minimap');
  const minimapFill = document.getElementById('minimapFill');
  let minimapRAF = false;
  function updateMinimap(){
    const maxScroll = Math.max(1, scroller.scrollWidth - scroller.clientWidth);
    const leftPct = (scroller.scrollLeft / (maxScroll + scroller.clientWidth)) * 100;
    const widthPct = (scroller.clientWidth / (maxScroll + scroller.clientWidth)) * 100;
    minimapFill.style.left = leftPct + "%";
    minimapFill.style.width = widthPct + "%";
  }
  scroller.addEventListener('scroll', () => {
    if (minimapRAF) return;
    minimapRAF = true;
    requestAnimationFrame(() => { updateMinimap(); minimapRAF = false; });
  });
  window.addEventListener('resize', updateMinimap);
  minimap.addEventListener('click', (e) => {
    const rect = minimap.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    const maxScroll = scroller.scrollWidth - scroller.clientWidth;
    scroller.scrollLeft = ratio * (maxScroll + scroller.clientWidth) - scroller.clientWidth / 2;
    stopPlaying();
  });

  // ---- deep link on load ----
  function applyHash(){
    const hash = location.hash;
    if (!hash) return;
    if (hash === '#today'){
      scrollToStepIdx(todayIdx, true);
      return;
    }
    const m = hash.match(/^#year=(-?\d+)$/);
    if (m){
      const y = parseInt(m[1], 10);
      const idx = yearToStepIdx(Math.max(START_YEAR, Math.min(CURRENT_YEAR, y)));
      scrollToStepIdx(idx, true);
    }
  }
  // ---- initial render (must run after every const/let above is initialized) ----
  relayout();
  refreshCategoryVisibility();
  updateMinimap();
  if (location.hash){
    setTimeout(applyHash, 0);
  }
</script>
